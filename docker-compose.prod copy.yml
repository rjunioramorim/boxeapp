version: '3.8'

services:
  app:
    image: ${IMAGE_NAME:-ghcr.io/rjunioramorim/boxeapp}:${IMAGE_TAG:-latest}

    networks:
      - network_public

    environment:
      NODE_ENV: production

      # URL pública do app (usada no build e runtime)
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}

      # Banco (definido no Portainer)
      DATABASE_URL: ${DATABASE_URL}

    deploy:
      mode: replicated
      replicas: 2

      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback

      rollback_config:
        parallelism: 1
        delay: 5s
        order: start-first

      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

      labels:
        # =====================
        # Traefik
        # =====================
        - traefik.enable=true
        - traefik.docker.network=network_public

        # Router
        - traefik.http.routers.${STACK_NAME:-app}.rule=Host(`${APP_DOMAIN}`)
        - traefik.http.routers.${STACK_NAME:-app}.entrypoints=websecure
        - traefik.http.routers.${STACK_NAME:-app}.tls.certresolver=letsencrypt

        # Service
        - traefik.http.services.${STACK_NAME:-app}.loadbalancer.server.port=3000
        - traefik.http.services.${STACK_NAME:-app}.loadbalancer.healthcheck.path=/api/health
        - traefik.http.services.${STACK_NAME:-app}.loadbalancer.healthcheck.interval=10s
        - traefik.http.services.${STACK_NAME:-app}.loadbalancer.healthcheck.timeout=3s

        # Middlewares
        - traefik.http.routers.${STACK_NAME:-app}.middlewares=security-headers,rate-limit

        - traefik.http.middlewares.security-headers.headers.framedeny=true
        - traefik.http.middlewares.security-headers.headers.sslredirect=true
        - traefik.http.middlewares.security-headers.headers.stsSeconds=31536000
        - traefik.http.middlewares.security-headers.headers.stsIncludeSubdomains=true
        - traefik.http.middlewares.security-headers.headers.stsPreload=true

        - traefik.http.middlewares.rate-limit.ratelimit.average=100
        - traefik.http.middlewares.rate-limit.ratelimit.burst=50

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1))"
        ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s

  migrate:
    image: ghcr.io/rjunioramorim/boxeapp:latest
    command: ["npm", "run", "db:migrate"]
    networks:
      - network_public
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
    deploy:
      restart_policy:
        condition: none
      replicas: 1    

networks:
  network_public:
    external: true
