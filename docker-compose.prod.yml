version: '3.8'

services:
  app:
    image: ghcr.io/rjunioramorim/boxeapp:latest
    networks:
      - network_public
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - NODE_ENV=production
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - CRON_SECRET=${CRON_SECRET}
      - TZ=America/Sao_Paulo
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      resources:
        limits:
          cpus: "0.5"
          memory: 256M  
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.app.rule=Host(`boxeapp.smartsolucoes.online`)"
        - "traefik.http.routers.app-http.rule=Host(`boxeapp.smartsolucoes.online`)"
        - "traefik.http.routers.app.entrypoints=websecure"
        - "traefik.http.routers.app-http.entrypoints=web"
        - "traefik.http.routers.app.tls.certresolver=letsencryptresolver"
        - "traefik.http.services.app.loadbalancer.server.port=3000"
        - "traefik.http.routers.app-http.middlewares=redirect-https@docker" 
        - "traefik.docker.network=network_public"

networks:
  network_public:
    name: network_public
    external: true
  
