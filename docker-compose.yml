# Desenvolvimento local (app + Postgres em containers).
# Só Postgres no Docker + app no host: use docker-compose.dev.yml.
# Uso: docker compose up -d postgres  (ou -f docker-compose.dev.yml para só DB).
# DATABASE_URL no host: postgresql://boxeapp:boxeapp@localhost:5432/boxeapp

services:
  postgres:
    image: postgres:16.3-alpine
    container_name: db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-docker}
      POSTGRES_DB: ${POSTGRES_DB:-boxeapp}
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-boxeapp}" ]
      interval: 5s
      timeout: 5s
      retries: 5
